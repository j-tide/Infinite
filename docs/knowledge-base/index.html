  <title>Infinite 项目知识库 - 项目接手导航器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f9fbfc;
      --text: #18202a;
      --muted: #667085;
      --subtle: #8a94a6;
      --line: #d9e1ea;
      --line-strong: #b9c5d2;
      --blue: #1769e0;
      --green: #147d64;
      --amber: #a05a00;
      --red: #b42318;
      --ink: #263445;
      --shadow: 0 8px 24px rgba(24, 32, 42, .08);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); background: var(--surface-2); }
    a { color: var(--blue); text-decoration: none; }
    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #eef2f6;
      color: #24364b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      word-break: break-word;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 318px;
      min-height: 100vh;
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
    }
    .brand { font-size: 17px; font-weight: 760; line-height: 1.25; color: var(--ink); }
    .brand-sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 3px; margin-top: 20px; }
    .nav a {
      display: block;
      color: var(--ink);
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 13px;
    }
    .nav a:hover { background: #eef3f8; }
    .main {
      min-width: 0;
      padding: 24px 28px 54px;
    }
    .inspector {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      padding: 18px 16px;
    }
    .hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 760; }
    h1 { margin: 5px 0 8px; font-size: 28px; line-height: 1.24; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 19px; line-height: 1.3; letter-spacing: 0; }
    h3 { margin: 16px 0 8px; font-size: 15px; line-height: 1.35; letter-spacing: 0; }
    p { margin: 8px 0; }
    .summary { max-width: 920px; color: #2f4053; font-size: 16px; line-height: 1.75; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #edf4ff;
      color: #174a8c;
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.green { background: #e8f6f1; color: var(--green); }
    .pill.amber { background: #fff4df; color: var(--amber); }
    .pill.red { background: #fff0ef; color: var(--red); }
    .section {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      overflow: auto;
    }
    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
      gap: 16px;
      align-items: start;
      margin-top: 16px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .stat {
      min-height: 82px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface-2);
    }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { margin-top: 5px; font-size: 18px; font-weight: 760; word-break: break-word; }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .timeline { display: grid; gap: 10px; }
    .step {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px;
      border: 1px solid transparent;
      border-radius: var(--radius);
    }
    .step:hover { border-color: var(--line); background: var(--surface-2); }
    .step-index {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 760;
      font-size: 12px;
    }
    .step-title { font-weight: 760; }
    .step-note { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .search {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 11px;
      background: #fff;
      color: var(--text);
    }
    .search-results {
      display: none;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .search-results.active { display: block; }
    .result-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .result-row:last-child { border-bottom: 0; }
    .result-row:hover { background: var(--surface-2); }
    .result-kind { color: var(--blue); font-size: 12px; font-weight: 720; }
    .arch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .lane {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      padding: 12px;
      min-height: 120px;
    }
    .lane ul { padding-left: 17px; margin: 8px 0 0; }
    .lane li { margin: 4px 0; }
    .flow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .flow-node {
      min-height: 78px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }
    .flow-node strong { display: block; }
    .flow-node span { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    .domain-list { display: grid; gap: 8px; margin-top: 10px; }
    .domain-row {
      display: grid;
      grid-template-columns: minmax(180px, .9fr) minmax(0, 1.35fr) 92px 92px 88px;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
    }
    .domain-row:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .domain-name { font-weight: 760; }
    .domain-path { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .bar-list { display: grid; gap: 9px; margin-top: 10px; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(140px, 220px) minmax(0, 1fr) 48px;
      gap: 10px;
      align-items: center;
    }
    .bar-track { height: 8px; border-radius: 999px; overflow: hidden; background: #e8edf3; }
    .bar-value { height: 100%; background: var(--green); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }
    th { color: var(--muted); font-size: 12px; background: #fafbfd; font-weight: 760; }
    .risk-high { color: var(--red); font-weight: 760; }
    .risk-medium { color: var(--amber); font-weight: 760; }
    .risk-low { color: var(--green); font-weight: 760; }
    .textarea {
      width: 100%;
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px;
      resize: vertical;
      background: #fbfcfe;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    .inspector h2 { margin-top: 0; }
    .inspect-empty {
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      color: var(--muted);
      background: var(--surface-2);
    }
    .kv {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 6px 10px;
      margin-top: 10px;
      font-size: 13px;
    }
    .kv .k { color: var(--muted); }
    .list { margin: 8px 0 0; padding-left: 18px; }
    .list li { margin: 5px 0; }
    .empty { color: var(--muted); padding: 10px 0; }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .tool-status {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .tool {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: var(--surface-2);
    }
    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector { position: relative; grid-column: 1 / -1; height: auto; border-left: 0; border-top: 1px solid var(--line); }
    }
    @media (max-width: 820px) {
      .app-shell { display: block; }
      .sidebar { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .main { padding: 16px; }
      .two-col { grid-template-columns: 1fr; }
      .domain-row { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr 1fr 42px; }
      h1 { font-size: 23px; }
    }
  </style>

    "<a class='pill' href='project-data.json'>project-data.json</a><a class='pill green' href='README.md'>知识库目录</a><a class='pill amber' href='README.md#架构与源码地图'>架构说明</a>" +
    "</div></aside>";
}

function renderHero() {
  const m = data.metadata;
  return "<section class='hero' id='overview'><div class='eyebrow'>" + esc(data.catalog.type) + "</div><h1>" + esc(m.name) + "</h1><p class='summary'>" + esc(m.summary) + "</p><div class='meta'>" +
    pill("技术栈：" + (m.stack || []).join(", ")) + pill("包管理器：" + (m.packageManager || "-")) + pill("分支：" + (m.git?.branch || "-")) + statusPill(data.runbook.status) + pill("文件：" + m.fileCount) +
    "</div></section>";
}

function renderSearch() {
  return "<section class='section'><div class='section-head'><div><h2>快速搜索</h2><p class='muted'>搜模块、API、脚本、入口文件。点结果后右侧会显示证据和上下游。</p></div></div><div class='toolbar'><input id='search' class='search' placeholder='例如：画布、任务、快照、保存、store、build'></div><div id='search-results' class='search-results'></div></section>";
}

function renderOverview() {
  const stats = [
    ["本地启动", data.runbook.devCommand || "未识别"],
    ["构建命令", data.runbook.buildCommand || "未识别"],
    ["模块数", data.domains.length],
    ["API 域", data.api.clusters.length],
    ["关键文件", data.source.importantFiles.length],
    ["风险提示", data.risks.length],
  ];
  return "<section class='section'><h2>先看结论</h2><div class='stat-grid'>" + stats.map(([label, value]) =>
    "<div class='stat'><div class='label'>" + esc(label) + "</div><div class='value'>" + esc(value) + "</div></div>"
  ).join("") + "</div><h3>软件目录信息</h3><div class='meta'>" +
    pill("类型：" + data.catalog.type) + pill("生命周期：" + data.catalog.lifecycle) + pill("Owner：" + data.catalog.owner) + (data.catalog.tags || []).map((tag) => pill(tag, "green")).join("") +
    "</div></section>";
}

function renderReadPath() {
  return "<section class='section' id='read'><h2>10 分钟接手路径</h2><p class='muted'>按顺序看，不需要一上来读完整仓库。</p><div class='timeline'>" +
    data.recommendations.readingPath.map((step, index) => "<div class='step' data-kind='read' data-index='" + index + "'><div class='step-index'>" + (index + 1) + "</div><div><div class='step-title'>" + esc(step.title) + " " + code(step.path) + "</div><div class='step-note'>" + esc(step.note) + "</div></div></div>").join("") +
    "</div></section>";
}

function renderArchitecture() {
  return "<section class='section' id='architecture'><div class='section-head'><div><h2>架构地图</h2><p class='muted'>沿启动、受控图、任务与保存链路定位代码。</p></div></div><div class='arch-grid'>" +
    data.architecture.lanes.map((lane) => "<div class='lane'><h3>" + esc(lane.label) + "</h3>" + list(lane.items, code) + "</div>").join("") +
    "</div><h3>核心链路</h3><div class='flow'>" + data.architecture.nodes.slice(0, 16).map((node, index) =>
      "<div class='flow-node' data-kind='arch' data-index='" + index + "'><strong>" + esc(node.label) + "</strong><span>" + esc(node.type) + "</span><span>" + esc(node.detail || node.layer || "") + "</span></div>"
    ).join("") + "</div></section>";
}

function renderDomains() {
  return "<section class='section' id='domains'><div class='section-head'><div><h2>模块地图</h2><p class='muted'>按接手权重排序。点模块看证据、上下游、风险和深挖命令。</p></div></div><div class='domain-list'>" +
    data.domains.map((domain, index) => "<div class='domain-row' data-kind='domain' data-index='" + index + "'><div><div class='domain-name'>" + esc(domain.layer + " / " + domain.name) + "</div><div class='domain-path'>" + esc(domain.path) + "</div></div><div>" + esc(domain.purpose) + "</div><div>" + domain.files + " 文件</div><div>" + domain.apiCount + " API</div><div>" + domain.downstream.length + " 下游</div></div>").join("") +
    "</div></section>";
}

function renderApiAndDeps() {
  const maxApi = maxValue(data.api.clusters, "count");
  const maxPkg = maxValue(data.dependencies.externalPackages, "count");
  return "<div class='two-col'><section class='section' id='api'><h2>API/后端域</h2><p class='muted'>README 的未来 HTTP 方案尚未实现；documentPersistence 是本地文档服务。</p><div class='bar-list'>" +
    (data.api.clusters.length ? data.api.clusters.map((item, index) => "<div class='bar-row' data-kind='api' data-index='" + index + "'><div>" + code(item.name) + "</div><div class='bar-track'><div class='bar-value' style='width:" + Math.max(8, Math.round(item.count / maxApi * 100)) + "%'></div></div><strong>" + item.count + "</strong></div>").join("") : "<div class='empty'>当前无 HTTP API。任务由浏览器定时器模拟，所有结果引用本地 SVG。</div>") +
    "</div></section><section class='section' id='deps'><h2>依赖和工具增强</h2><p class='muted'>优先展示解释项目能力边界的包，以及成熟工具是否参与增强。</p><div class='bar-list'>" +
    (data.dependencies.externalPackages || []).slice(0, 12).map((item) => "<div class='bar-row'><div>" + code(item.name) + "</div><div class='bar-track'><div class='bar-value' style='width:" + Math.max(8, Math.round(item.count / maxPkg * 100)) + "%'></div></div><strong>" + item.count + "</strong></div>").join("") +
    "</div><div class='tool-status'>" + (data.dependencies.tools || []).map((tool) => "<div class='tool'><strong>" + esc(tool.name) + "</strong><div>" + pill(tool.status, tool.status === "ok" || tool.status === "available" ? "green" : tool.status === "missing" || tool.status === "skipped" ? "amber" : "red") + "</div><p class='muted'>" + esc(tool.summary || tool.reason || "") + "</p></div>").join("") + "</div></section></div>";
}

function renderRunbook() {
  const commands = commandGroups(data.runbook.commands);
  return "<section class='section' id='runbook'><h2>怎么跑起来</h2><p class='muted'>Node.js ≥20 与 npm；npm ci 后运行 npm run dev。无需账号、API Key、环境文件或后端。build 包含 src 的类型检查。</p><table><thead><tr><th>类别</th><th>脚本</th><th>命令</th></tr></thead><tbody>" +
    rows(commands, (item) => [esc(groupLabel(item.group)), code(item.name), code(item.command)]) +
    "</tbody></table><h3>运行输入</h3><div class='meta'>" + (data.runbook.envFiles || []).map((item) => pill(item, "amber")).join("") + (data.runbook.ci || []).map((item) => pill(item, "green")).join("") + "</div></section>";
}

function renderRisks() {
  return "<section class='section' id='risks'><h2>风险和下一步</h2><table><thead><tr><th>级别</th><th>说明</th><th>证据</th></tr></thead><tbody>" +
    rows(data.risks, (risk) => ["<span class='" + riskClass(risk.level) + "'>" + esc(zhLevel(risk.level)) + "</span>", esc(risk.message), code(risk.evidence)]) +
    "</tbody></table><h3>建议继续深挖</h3><table><thead><tr><th>模块</th><th>原因</th><th>命令</th></tr></thead><tbody>" +
    rows(data.recommendations.deepDives, (item) => [code(item.path), esc(item.reason), code(item.command)]) +
    "</tbody></table></section>";
}

function renderAiPack() {
  return "<section class='section' id='ai'><div class='section-head'><div><h2>AI 接手包</h2><p class='muted'>需要继续问 AI 某个模块时，复制这段比复制全仓库更有效。</p></div><button id='copy-ai'>复制</button></div><textarea class='textarea' id='ai-text' readonly>" + esc(data.aiPack.copyText) + "</textarea></section>";
}

function buildSearchIndex() {
  const items = [];
  data.domains.forEach((domain, index) => items.push({ kind: "模块", title: domain.layer + " / " + domain.name, detail: domain.path + " " + domain.purpose, inspect: ["domain", index] }));
  data.api.clusters.forEach((api, index) => items.push({ kind: "API", title: api.name, detail: api.count + " references " + api.evidence, inspect: ["api", index] }));
  commandGroups(data.runbook.commands).forEach((cmd) => items.push({ kind: "命令", title: cmd.name, detail: cmd.command + " " + groupLabel(cmd.group), inspect: null }));
  data.source.importantFiles.forEach((file) => items.push({ kind: "文件", title: file, detail: "关键阅读文件", inspect: null }));
  data.source.entrypoints.federation.forEach((item) => items.push({ kind: "MF", title: item.name, detail: item.target + " " + item.evidence, inspect: null }));
  return items;
}

function bindInteractions() {
  const inspector = $("#inspector");
  document.querySelectorAll("[data-kind]").forEach((node) => {
    node.addEventListener("click", () => inspect(node.dataset.kind, Number(node.dataset.index)));
  });
  $("#copy-ai")?.addEventListener("click", async () => {
    const text = $("#ai-text").value;
    try { await navigator.clipboard.writeText(text); $("#copy-ai").textContent = "已复制"; }
    catch { $("#copy-ai").textContent = "复制失败"; }
  });
  const search = $("#search");
  const results = $("#search-results");
  const index = buildSearchIndex();
  search?.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { results.classList.remove("active"); results.innerHTML = ""; return; }
    const hits = index.filter((item) => (item.title + " " + item.detail + " " + item.kind).toLowerCase().includes(q)).slice(0, 20);
    results.innerHTML = hits.length ? hits.map((item, i) => "<div class='result-row' data-hit='" + i + "'><div class='result-kind'>" + esc(item.kind) + "</div><div><strong>" + esc(item.title) + "</strong><div class='muted'>" + esc(item.detail) + "</div></div></div>").join("") : "<div class='empty'>没有搜到</div>";
    results.classList.add("active");
    results.querySelectorAll("[data-hit]").forEach((row) => {
      row.addEventListener("click", () => {
        const hit = hits[Number(row.dataset.hit)];
        if (hit.inspect) inspect(hit.inspect[0], hit.inspect[1]);
      });
    });
  });

  function inspect(kind, index) {
    let html = renderInspectorEmpty();
    if (kind === "domain") html = inspectDomain(data.domains[index]);
    if (kind === "api") html = inspectApi(data.api.clusters[index]);
    if (kind === "arch") html = inspectArch(data.architecture.nodes[index]);
    if (kind === "read") html = inspectRead(data.recommendations.readingPath[index]);
    inspector.innerHTML = html;
  }
}

function renderInspectorEmpty() {
  return "<h2>证据面板</h2><div class='inspect-empty'>点击模块、API、架构节点或阅读步骤，这里会显示证据路径、上下游和下一步动作。</div>";
}
function inspectDomain(domain) {
  return "<h2>" + esc(domain.layer + " / " + domain.name) + "</h2><p>" + esc(domain.purpose) + "</p><div class='kv'><div class='k'>路径</div><div>" + code(domain.path) + "</div><div class='k'>文件</div><div>" + domain.files + "</div><div class='k'>API</div><div>" + domain.apiCount + "</div><div class='k'>状态</div><div>" + domain.stateCount + "</div></div><h3>关键文件</h3>" + list(domain.keyFiles, code) + "<h3>上游</h3>" + list(domain.upstream, esc) + "<h3>下游</h3>" + list(domain.downstream, esc) + "<h3>风险</h3>" + list(domain.riskHints, esc) + "<h3>深入阅读</h3>" + code(domain.deepDiveCommand);
}
function inspectApi(api) {
  const endpoints = data.api.endpoints.filter((item) => item.path.startsWith(api.name)).slice(0, 20);
  return "<h2>API 域 " + esc(api.name) + "</h2><p class='muted'>出现 " + api.count + " 次，首个证据：" + code(api.evidence) + "</p><h3>接口样例</h3>" + list(endpoints, (item) => code(item.path) + " <span class='muted'>" + esc(item.evidence) + "</span>");
}
function inspectArch(node) {
  const edges = data.architecture.edges.filter((edge) => edge.from === node.id || edge.to === node.id);
  return "<h2>" + esc(node.label) + "</h2><div class='kv'><div class='k'>类型</div><div>" + esc(node.type) + "</div><div class='k'>层级</div><div>" + esc(node.layer) + "</div><div class='k'>证据</div><div>" + code(node.detail) + "</div></div><h3>关系</h3>" + list(edges, (edge) => esc(edge.from + " --" + edge.label + "--> " + edge.to));
}
function inspectRead(step) {
  return "<h2>" + esc(step.title) + "</h2><p>" + esc(step.note) + "</p><div class='kv'><div class='k'>路径</div><div>" + code(step.path) + "</div><div class='k'>证据</div><div>" + code(step.evidence) + "</div></div>";
}

render();

</script>
</body>
</html>
